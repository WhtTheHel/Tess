<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masuk - Kopi Nusantara</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">KOPI NUSANTARA</a>
    </div>
</nav>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="login-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M11 2a3 3 0 0 0-3 3v2H6a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1H9V5a2 2 0 1 1 4 0v1h1V5a3 3 0 0 0-3-3z"/>
                </svg>
            </div>
            <h3 class="fw-bold mb-1">Selamat Datang</h3>
            <p class="text-muted small mb-0">Masuk ke akun Kopi Nusantara Anda</p>
        </div>

        <div id="login-form-container">
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" id="login-email" class="form-control" placeholder="nama@email.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Kata Sandi</label>
                    <div class="position-relative">
                        <input type="password" id="login-password" class="form-control pe-5" placeholder="Masukkan kata sandi" required>
                        <button type="button" class="btn-toggle-password position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent me-2" onclick="togglePassword('login-password', this)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="#999" viewBox="0 0 16 16" class="eye-icon">
                                <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                                <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="login-error" class="alert alert-danger d-none small py-2 px-3"></div>
                <button type="submit" id="login-btn" class="btn btn-kopi w-100 py-2 fw-bold mb-3">
                    <span class="btn-text">MASUK</span>
                    <span class="btn-spinner d-none">
                        <span class="spinner-border spinner-border-sm me-1"></span> Memproses...
                    </span>
                </button>
                <p class="text-center text-muted small mb-0">
                    Belum punya akun? <a href="#" class="link-kopi fw-semibold" onclick="showRegister(event)">Daftar di sini</a>
                </p>
            </form>

            <form id="register-form" class="d-none" onsubmit="handleRegister(event)">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Nama Lengkap</label>
                    <input type="text" id="register-name" class="form-control" placeholder="Nama Anda" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email</label>
                    <input type="email" id="register-email" class="form-control" placeholder="nama@email.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Kata Sandi</label>
                    <div class="position-relative">
                        <input type="password" id="register-password" class="form-control pe-5" placeholder="Minimal 6 karakter" required minlength="6">
                        <button type="button" class="btn-toggle-password position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent me-2" onclick="togglePassword('register-password', this)">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="#999" viewBox="0 0 16 16" class="eye-icon">
                                <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                                <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="register-error" class="alert alert-danger d-none small py-2 px-3"></div>
                <button type="submit" id="register-btn" class="btn btn-kopi w-100 py-2 fw-bold mb-3">
                    <span class="btn-text">DAFTAR</span>
                    <span class="btn-spinner d-none">
                        <span class="spinner-border spinner-border-sm me-1"></span> Memproses...
                    </span>
                </button>
                <p class="text-center text-muted small mb-0">
                    Sudah punya akun? <a href="#" class="link-kopi fw-semibold" onclick="showLogin(event)">Masuk di sini</a>
                </p>
            </form>
        </div>

        <div id="logged-in-container" class="d-none text-center">
            <div class="mb-3">
                <div class="login-icon bg-success-subtle text-success">
                    <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.06L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
                    </svg>
                </div>
            </div>
            <h5 class="fw-bold mb-1">Anda Sudah Masuk</h5>
            <p class="text-muted small mb-3" id="user-email-display"></p>
            <a href="/" class="btn btn-kopi w-100 py-2 fw-bold mb-2">KEMBALI KE BERANDA</a>
            <button class="btn btn-outline-danger w-100 py-2 fw-bold" onclick="handleLogout()">KELUAR</button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script type="module" src="/login.js"></script>
</body>
</html>
