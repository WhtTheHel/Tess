<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Produk - Kopi Nusantara</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        /* Responsivitas Kartu */
        .card-produk { border: none; border-radius: 15px; transition: 0.3s; height: 100%; display: flex; flex-direction: column; }
        .card-produk:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .img-container { height: 180px; overflow: hidden; border-top-left-radius: 15px; border-top-right-radius: 15px; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Gaya Dropdown & Tombol */
        .form-select-sm { font-size: 0.8rem; border-radius: 8px; margin-bottom: 10px; }
        .btn-wa { background-color: #25d366; color: white; font-weight: bold; font-size: 0.9rem; border-radius: 10px; }
        .btn-wa:hover { background-color: #128c7e; color: white; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">☕ KOPI NUSANTARA</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link active" href="produk.html">Katalog Produk</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="text-center mb-5">
        <h2 class="fw-bold">Menu Kopi Terbaik</h2>
        <p class="text-muted">Pilih suhu dan pesan langsung via WhatsApp</p>
    </div>

    <div class="row g-3 g-md-4">
        
        <div class="col-6 col-md-4 col-lg-3">
            <div class="card card-produk shadow-sm">
                <div class="img-container">
                    <img src="img/espresso.jpg" alt="Espresso">
                </div>
                <div class="card-body p-3 d-flex flex-column">
                    <h6 class="fw-bold mb-1">Espresso Gayo</h6>
                    <p class="text-success small fw-bold mb-2">Rp 15.000</p>
                    
                    <label class="small text-muted mb-1">Pilih Suhu:</label>
                    <select class="form-select form-select-sm" id="temp-espresso">
                        <option value="Panas">🔥 Panas</option>
                        <option value="Dingin">❄️ Dingin</option>
                    </select>

                    <button onclick="pesanKopi('Espresso Gayo', 'temp-espresso')" class="btn btn-wa w-100 mt-auto">Pesan</button>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-4 col-lg-3">
            <div class="card card-produk shadow-sm">
                <div class="img-container">
                    <img src="img/latte.jpg" alt="Latte">
                </div>
                <div class="card-body p-3 d-flex flex-column">
                    <h6 class="fw-bold mb-1">Caffe Latte</h6>
                    <p class="text-success small fw-bold mb-2">Rp 22.000</p>
                    
                    <label class="small text-muted mb-1">Pilih Suhu:</label>
                    <select class="form-select form-select-sm" id="temp-latte">
                        <option value="Panas">🔥 Panas</option>
                        <option value="Dingin">❄️ Dingin</option>
                    </select>

                    <button onclick="pesanKopi('Caffe Latte', 'temp-latte')" class="btn btn-wa w-100 mt-auto">Pesan</button>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    function pesanKopi(namaProduk, idSelect) {
        // Mengambil pilihan suhu dari dropdown
        var suhu = document.getElementById(idSelect).value;
        var nomorWA = "628123456789"; // Ganti dengan nomor WA Anda
        
        // Membuat pesan otomatis
        var pesan = "Halo Admin, saya ingin pesan " + namaProduk + " (" + suhu + ")";
        
        // Mengarahkan ke WhatsApp
        window.open("https://wa.me/" + nomorWA + "?text=" + encodeURIComponent(pesan), '_blank');
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
