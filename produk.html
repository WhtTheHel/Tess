<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Menu - Kopi Nusantara</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f1ea; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-produk { border: none; border-radius: 15px; overflow: hidden; background: #fff; }
        .img-container { width: 100px; height: 100px; overflow: hidden; border-radius: 12px; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; }
        .counter-btn { 
            width: 32px; height: 32px; border-radius: 8px; 
            border: 1px solid #8b4513; background: white; 
            color: #8b4513; font-weight: bold; 
        }
        .total-sticky { 
            position: fixed; bottom: 0; left: 0; right: 0; 
            background: #fff; padding: 15px; 
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1); z-index: 1000; 
            border-top: 3px solid #8b4513;
        }
        .qty { min-width: 25px; text-align: center; display: inline-block; }
        .form-label { font-weight: bold; color: #444; }
    </style>
</head>
<body class="pb-5">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">☕ KOPI NUSANTARA</a>
        <div class="ms-auto">
            <a href="index.html" class="btn btn-outline-light btn-sm">Beranda</a>
        </div>
    </div>
</nav>

<div class="container mb-5">
    <div class="bg-white p-3 rounded-4 shadow-sm mb-4">
        <label for="nama-pembeli" class="form-label">Nama Pemesan :</label>
        <input type="text" id="nama-pembeli" class="form-control" placeholder="Masukkan nama Anda..." required>
    </div>

    <h5 class="fw-bold mb-3 text-dark">Pilih Menu Favorit</h5>

    <div class="row g-3">
        <div class="col-12 col-md-6">
            <div class="card card-produk shadow-sm p-2">
                <div class="d-flex align-items-center">
                    <div class="img-container shadow-sm">
                        <img src="img/espresso.jpg" alt="Espresso">
                    </div>
                    <div class="card-body py-1 px-3">
                        <h6 class="fw-bold mb-1">Espresso Gayo</h6>
                        <p class="text-secondary small mb-2">Rp <span class="harga">15000</span></p>
                        <div class="d-flex align-items-center gap-2">
                            <select class="form-select form-select-sm suhu" style="width: 90px;">
                                <option value="Panas">Panas</option>
                                <option value="Dingin">Dingin</option>
                            </select>
                            <div class="ms-auto d-flex align-items-center">
                                <button class="counter-btn" onclick="updateQty(this, -1)">-</button>
                                <span class="mx-2 fw-bold qty">0</span>
                                <button class="counter-btn" onclick="updateQty(this, 1)">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-12 col-md-6">
            <div class="card card-produk shadow-sm p-2">
                <div class="d-flex align-items-center">
                    <div class="img-container shadow-sm">
                        <img src="img/latte.jpg" alt="Latte">
                    </div>
                    <div class="card-body py-1 px-3">
                        <h6 class="fw-bold mb-1">Caffe Latte</h6>
                        <p class="text-secondary small mb-2">Rp <span class="harga">22000</span></p>
                        <div class="d-flex align-items-center gap-2">
                            <select class="form-select form-select-sm suhu" style="width: 90px;">
                                <option value="Panas">Panas</option>
                                <option value="Dingin">Dingin</option>
                            </select>
                            <div class="ms-auto d-flex align-items-center">
                                <button class="counter-btn" onclick="updateQty(this, -1)">-</button>
                                <span class="mx-2 fw-bold qty">0</span>
                                <button class="counter-btn" onclick="updateQty(this, 1)">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="total-sticky">
    <div class="container d-flex justify-content-between align-items-center">
        <div>
            <p class="small text-muted mb-0">Total Harga</p>
            <h4 class="fw-bold text-success mb-0">Rp <span id="grand-total">0</span></h4>
        </div>
        <button class="btn btn-success px-4 py-2 fw-bold rounded-pill shadow" onclick="kirimStruk()">
            KONFIRMASI PESANAN
        </button>
    </div>
</div>

<script>
    function updateQty(btn, change) {
        const parent = btn.closest('.card-body');
        let qtySpan = parent.querySelector('.qty');
        let currentQty = parseInt(qtySpan.innerText);
        currentQty += change;
        if (currentQty < 0) currentQty = 0;
        qtySpan.innerText = currentQty;
        hitungTotal();
    }

    function hitungTotal() {
        let total = 0;
        document.querySelectorAll('.card-body').forEach(item => {
            const harga = parseInt(item.querySelector('.harga').innerText);
            const qty = parseInt(item.querySelector('.qty').innerText);
            total += harga * qty;
        });
        document.getElementById('grand-total').innerText = total.toLocaleString('id-ID');
    }

    function kirimStruk() {
        const namaUser = document.getElementById('nama-pembeli').value;
        if (!namaUser) {
            alert("Harap masukkan nama pemesan terlebih dahulu!");
            return;
        }

        const sekarang = new Date();
        const opsiTanggal = { year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit' };
        const tanggalWaktu = sekarang.toLocaleDateString('id-ID', opsiTanggal);

        let struk = "==========================\\n";
        struk += "        ☕ *KOPI NUSANTARA* \\n";
        struk += "==========================\\n";
        struk += `👤 Pelanggan: *${namaUser}*\\n`;
        struk += `📅 ${tanggalWaktu}\\n`;
        struk += "------------------------------------------------\\n\\n";

        let hasOrder = false;
        let total = 0;

        document.querySelectorAll('.card-body').forEach(item => {
            const nama = item.querySelector('h6').innerText;
            const qty = parseInt(item.querySelector('.qty').innerText);
            const harga = parseInt(item.querySelector('.harga').innerText);
            const suhu = item.querySelector('.suhu').value;

            if (qty > 0) {
                let subtotal = qty * harga;
                struk += `✅ *${nama}* (${suhu})\\n`;
                struk += `   ${qty} x ${harga.toLocaleString('id-ID')} -> Rp ${subtotal.toLocaleString('id-ID')}\\n\\n`;
                total += subtotal;
                hasOrder = true;
            }
        });

        if (!hasOrder) {
            alert("Pilih minimal satu item!");
            return;
        }

        struk += "-------------------------------------------\\n";
        struk += `*TOTAL BAYAR : Rp ${total.toLocaleString('id-ID')}*\\n`;
        struk += "-------------------------------------------\\n\\n";
        struk += "            *TERIMA KASIH* \\n";
        struk += "   Sudah Menikmati Kopi Kami   \\n";
        struk += "==========================\\n";
        
        const nomorWA = "6282184938376"; // GANTI DENGAN NOMOR WA ANDA
        window.open(`https://wa.me/${nomorWA}?text=${encodeURIComponent(struk.replace(/\\n/g, '\n'))}`, '_blank');
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
        </html>
