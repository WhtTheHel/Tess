<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Produk - Kopi Nusantara</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f1ea; font-family: 'Segoe UI', sans-serif; }
        
        /* Navbar Styling */
        .navbar-brand { font-weight: bold; letter-spacing: 1px; }

        /* Card Styling */
        .card-produk { 
            border: none; 
            border-radius: 15px; 
            transition: 0.3s; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            background: #fff;
        }
        .card-produk:hover { 
            transform: translateY(-8px); 
            box-shadow: 0 12px 24px rgba(0,0,0,0.15); 
        }

        /* Image Styling */
        .img-container { 
            height: 160px; 
            overflow: hidden; 
            border-top-left-radius: 15px; 
            border-top-right-radius: 15px; 
        }
        .img-container img { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
        }

        /* Button & Form Styling */
        .price-tag { color: #8b4513; font-weight: bold; font-size: 1.1rem; }
        .btn-wa { 
            background-color: #25d366; 
            color: white; 
            font-weight: bold; 
            border-radius: 10px; 
            border: none;
            transition: 0.2s;
        }
        .btn-wa:hover { background-color: #128c7e; color: white; }
        .form-select-sm { border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow">
    <div class="container">
        <a class="navbar-brand" href="index.html">☕ KOPI NUSANTARA</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                <li class="nav-item"><a class="nav-link active" href="produk.html">Katalog Produk</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container my-5">
    <div class="text-center mb-5">
        <h2 class="fw-bold text-dark">Menu Spesial Kami</h2>
        <p class="text-muted">Pilih selera Anda dan pesan langsung via WhatsApp</p>
    </div>

    <div class="row g-3 g-md-4">
        
        <div class="col-6 col-md-4 col-lg-3">
            <div class="card card-produk shadow-sm">
                <div class="img-container">
                    <img src="img/espresso.jpg" alt="Espresso">
                </div>
                <div class="card-body p-3 d-flex flex-column">
                    <h6 class="fw-bold mb-1">Espresso Gayo</h6>
                    <p class="price-tag mb-2">Rp 15.000</p>
                    
                    <label class="small text-muted mb-1">Suhu:</label>
                    <select class="form-select form-select-sm mb-3" id="suhu-espresso">
                        <option value="Panas">🔥 Panas</option>
                        <option value="Dingin">❄️ Dingin</option>
                    </select>

                    <button onclick="kirimPesan('Espresso Gayo', 'suhu-espresso')" class="btn btn-wa w-100 mt-auto">Pesan</button>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-4 col-lg-3">
            <div class="card card-produk shadow-sm">
                <div class="img-container">
                    <img src="img/americano.jpg" alt="Americano">
                </div>
                <div class="card-body p-3 d-flex flex-column">
                    <h6 class="fw-bold mb-1">Americano</h6>
                    <p class="price-tag mb-2">Rp 18.000</p>
                    
                    <label class="small text-muted mb-1">Suhu:</label>
                    <select class="form-select form-select-sm mb-3" id="suhu-americano">
                        <option value="Panas">🔥 Panas</option>
                        <option value="Dingin">❄️ Dingin</option>
                    </select>

                    <button onclick="kirimPesan('Americano', 'suhu-americano')" class="btn btn-wa w-100 mt-auto">Pesan</button>
                </div>
            </div>
        </div>

        <div class="col-6 col-md-4 col-lg-3">
            <div class="card card-produk shadow-sm">
                <div class="img-container">
                    <img src="img/latte.jpg" alt="Caffe Latte">
                </div>
                <div class="card-body p-3 d-flex flex-column">
                    <h6 class="fw-bold mb-1">Caffe Latte</h6>
                    <p class="price-tag mb-2">Rp 22.000</p>
                    
                    <label class="small text-muted mb-1">Suhu:</label>
                    <select class="form-select form-select-sm mb-3" id="suhu-latte">
                        <option value="Panas">🔥 Panas</option>
                        <option value="Dingin">❄️ Dingin</option>
                    </select>

                    <button onclick="kirimPesan('Caffe Latte', 'suhu-latte')" class="btn btn-wa w-100 mt-auto">Pesan</button>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    function kirimPesan(namaKopi, idSuhu) {
        var suhuPilihan = document.getElementById(idSuhu).value;
        var nomorAdmin = "628123456789"; // GANTI DENGAN NOMOR WA ANDA
        
        var teks = "Halo Admin, saya ingin pesan " + namaKopi + " (" + suhuPilihan + ")";
        var linkWA = "https://wa.me/" + nomorAdmin + "?text=" + encodeURIComponent(teks);
        
        window.open(linkWA, '_blank');
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
